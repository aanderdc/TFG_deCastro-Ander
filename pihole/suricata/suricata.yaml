%YAML 1.1
---
vars:
  address-groups:
    HOME_NET: "192.168.0.0/16"
    EXTERNAL_NET: "!$HOME_NET"

af-packet:
  - interface: wlan0
    cluster-id: 99
    cluster-type: cluster_flow
    defrag: yes

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: /var/log/suricata/eve.json
      types:
        - alert:
            payload: no
            packet: no
        - dns
        - http

default-rule-path: /etc/suricata/rules
rule-files:
  - suricata.rules

logging:
  default-log-level: notice
  outputs:
    - console:
        enabled: no
    - file:
        enabled: yes
        filename: /var/log/suricata/suricata.log
