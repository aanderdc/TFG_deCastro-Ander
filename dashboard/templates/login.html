<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso — S.I.E.M. PYME</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 1rem;
        }
        .login-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 2rem;
            width: 100%;
            max-width: 410px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
            color: #f8fafc;
        }
        .form-control {
            background-color: #0f172a;
            border: 1px solid #475569;
            color: #f8fafc;
        }
        .form-control:focus {
            background-color: #0f172a;
            border-color: #3b82f6;
            color: #f8fafc;
            box-shadow: 0 0 0 0.2rem rgba(59, 130, 246, 0.25);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <div style="font-size: 2rem;">🛡️</div>
            <h4 class="fw-bold mb-1">S.I.E.M. PYME</h4>
            <p class="text-secondary small mb-0">Protección de Red para Librerías e Imprentas</p>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 small" role="alert">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form action="{{ url_for('siem.login') }}" method="POST" autocomplete="off">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="mb-3">
                <label for="username" class="form-label small text-light">Usuario</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="admin" required autofocus>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label small text-light">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-semibold py-2">Iniciar Sesión</button>
        </form>

        <div class="text-center mt-4">
            <small class="text-secondary">Acceso protegido con TLS, CSRF y Rate-Limiting</small>
        </div>
    </div>
</body>
</html>
